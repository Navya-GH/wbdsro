<!DOCTYPE html>

<html>

<head>

<title>Tools</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

background:#0b1535;

font-family:Arial;

color:white;

padding:40px;

}

h1{

text-align:center;

font-size:65px;

margin-bottom:50px;

}

.back{

display:inline-block;

color:#a78bfa;

font-size:24px;

text-decoration:none;

margin-bottom:35px;

}

.container{

max-width:1700px;

margin:auto;

}

/* EXACTLY 6 ITEMS PER ROW */

.tool-grid{

display:grid;

grid-template-columns:

repeat(
6,
1fr
);

gap:18px;

}

.tool{

display:flex;

align-items:center;

justify-content:center;

height:85px;

padding:12px;

background:#334155;

border-radius:18px;

font-size:22px;

font-weight:700;

color:white;

text-decoration:none;

text-align:center;

transition:.25s;

}

.tool:hover{

transform:
translateY(-6px);

background:

linear-gradient(
135deg,
#6366f1,
#9333ea
);

box-shadow:

0 12px 30px

rgba(
147,
51,
234,
0.45
);

}

/* Tablet */

@media(max-width:1200px){

.tool-grid{

grid-template-columns:

repeat(
4,
1fr
);

}

}

/* Mobile */

@media(max-width:768px){

body{

padding:20px;

}

h1{

font-size:42px;

}

.tool-grid{

grid-template-columns:

repeat(
2,
1fr
);

}

.tool{

font-size:18px;

height:70px;

}

}

</style>

</head>

<body>

<a
class="back"
href="index.html">

← Back

</a>
