<!DOCTYPE html>

<style>

*{box-sizing:border-box;}

body{

margin:0;

object-position:center;

z-index:-10;

background:#020617;

transform:translateZ(0);

backface-visibility:hidden;

}


body::after{

content:"";

position:fixed;

inset:0;

background:

linear-gradient(

180deg,

rgba(
2,
8,
23,
0.18
),

rgba(
2,
8,
23,
0.42

)

);

z-index:-5;

pointer-events:none;

}

.top{

display:flex;

justify-content:space-between;

align-items:flex-start;

margin-bottom:10px;

}

.timezones{

display:flex;

gap:10px;

}

.tz{

padding:10px 18px;

border-radius:14px;

background:

rgba(
255,
255,
255,
0.08
);

blur(18px);

}

width:min(
850px,

rgba(

.container{

.main-btn{

.main-btn:hover{

translateY(-6px);

135deg,
#5b5cf6,
#8b5cf6
);

}

a{

}

.pd-mini{

position:fixed;

right:80px;

top:40px;

width:330px;

z-index:70;

background:none;

backdrop-filter:none;

padding:0;

animation:
float 5s ease-in-out infinite;

}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-8px);
}

100%{
transform:translateY(0px);
}

}

.pd-title{

font-size:24px;

font-weight:700;

margin-bottom:10px;

}

.pd-grid{

display:flex;

gap:10px;

}

.pd-card{

flex:1;

padding:15px;

border-radius:22px;

background:

rgba(
255,
255,
255,
0.04
);

backdrop-filter:
blur(14px);

border:

1px solid

rgba(
255,
255,
255,
0.08
);

transition:.4s;

}

.pd-card:hover{

transform:
translateY(-3px);

}

.pd-label{

font-size:30px;

font-weight:bold;

margin-bottom:10px;

}

.stat-row{

display:flex;

justify-content:space-between;

padding:5px 0;

font-size:14px;

}

.value{

font-weight:bold;

font-size:18px;

}

.p1{

background:
rgba(239,68,68,.18);

}

.p2{

background:
rgba(249,115,22,.18);

}

.p3{

background:
rgba(234,179,8,.18);

}

.alert{

animation:
danger .8s infinite;

box-shadow:

0 0 50px rgba(255,0,0,.9);

}

@keyframes danger{

0%{

opacity:1;

transform:scale(1);

}

50%{

opacity:.45;

transform:scale(1.05);

}

100%{

opacity:1;

transform:scale(1);

}

}

background:
rgba(234,179,8,.18);

}

@media(max-width:900px){

.pd-mini{

position:relative;

width:100%;

right:auto;

bottom:auto;

margin-top:35px;

}

}

.footer{

position:fixed;

bottom:18px;

left:0;

width:100%;

text-align:center;

opacity:.55;

font-size:18px;

pointer-events:none;

}

@media(max-width:900px){

h1{

font-size:46px;

}

.timezones{

justify-content:center;

}

.footer{

bottom:12px;

}

}

.login-box{

display:flex;

flex-direction:column;

gap:18px;

width:420px;

}

.login-box input{

height:62px;

padding:18px;

border:none;

border-radius:18px;

background:

rgba(
255,
255,
255,
0.08
);

backdrop-filter:
blur(18px);

color:white;

font-size:18px;

}

.login-box button{

height:64px;

border:none;

border-radius:18px;

font-size:22px;

font-weight:bold;

cursor:pointer;

color:white;

background:

linear-gradient(
135deg,
#5b5cf6,
#8b5cf6
);

#error{

color:#ff6b6b;

font-size:18px;

text-align:center;

margin-top:10px;

.request-btn{

height:52px;

border:none;

border-radius:16px;

cursor:pointer;

font-size:16px;

color:white;

background:

rgba(
255,
255,
255,
0.08
);

backdrop-filter:
blur(12px);

transition:.3s;

}

.request-btn:hover{

background:

rgba(
255,
255,
255,
0.16
);

}

</style>

<script>

/* ---------- LOGIN ---------- */

const USERS={

"navya.teja@wbd.com":"sro@2026",
"venkataharish.mitta@wbd.com":"sro@2026",
"somana.nagasaikrishna@wbd.com":"sro@2026",
"linginenisampath.kumar@wbd.com":"sro@2026",
"manisha.gutlapalli@wbd.com":"sro@2026",
"chitturisrijaya.venkatasurya@wbd.com":"sro@2026",
"masani.reddy@wbd.com":"sro@2026",
"akash.vankadari@wbd.com":"sro@2026",
"naveen.vonna@wbd.com":"sro@2026",
"yogananda.t@wbd.com":"sro@2026",
"manasa.g@wbd.com":"sro@2026",
"paul.hobbs@wbd.com":"sro@2026",
"jaspal.bhatia@wbd.com":"sro@2026",
"vignesh.pandurangan@wbd.com":"sro@2026",
"divya.m@wbd.com":"sro@2026",

"abc@wbd.com":"welcome123"

};

function login(){

const email=

document
.getElementById(
"email"
)
.value
.trim()
.toLowerCase();

const password=

document
.getElementById(
"password"
)
.value;

if(

USERS[email]

&&

USERS[email]===password

){

localStorage.setItem(
"navexLogin",
"ok"
);

localStorage.setItem(
"navexUser",
email
);

document
.getElementById(
"login-screen"
)
.style.display="none";

}

else{

document
.getElementById(
"error"
)
.innerHTML=

"Invalid email or password";

}

}

window.addEventListener(

"load",

()=>{

if(

localStorage.getItem(
"navexLogin"
)

===

"ok"

){

document
.getElementById(
"login-screen"
)
.style.display="none";

}

}

);

function logout(){

localStorage.clear();

location.reload();

}

/* ---------- END LOGIN ---------- */

function requestAccess(){

const email=

document
.getElementById(
"email"
)
.value
.trim();

const message=

`Hi Navya,

Please provide access to NAVEX Dashboard.

Requester:
${email}`;

navigator.clipboard.writeText(
message
);

alert(
"Access request copied. Please send it to Navya on Teams or Outlook."
);

window.open(

"https://outlook.office.com/mail/deeplink/compose?to=navya.teja@wbd.com&subject=NAVEX%20Dashboard%20Access%20Request"

);

}

function format(zone){

return new Date()

.toLocaleTimeString(
"en-GB",
{
hour12:false,
timeZone:zone
}

);

}


function clock(){

document.getElementById("ist").innerHTML=
format("Asia/Kolkata");

document.getElementById("utc").innerHTML=
format("UTC");

document.getElementById("bst").innerHTML=
format("Europe/London");

document.getElementById("pst").innerHTML=
format("America/Los_Angeles");

let hr=
new Date().getHours();

document.getElementById(
"greeting"
).innerHTML=

hr<12
?
"Good Morning"

:
hr<18
?
"Good Afternoon"

:
"Good Evening";

}

clock();

setInterval(
clock,
1000
);



function filterButtons(){

let val=

document
.getElementById(
"search"
)
.value
.trim()
.toLowerCase();


const toolItems=

`
tools
mux
mediamelon
inflow
ad-platform ui
tundra
sdp console
tempo
studio
dacc
grafana
foundry
taiga
chimera
kibana
disco
datadog
coui
`
.toLowerCase();


document
.querySelectorAll(
".container a"
)

.forEach(

x=>{

let searchable=

(
x.dataset.search
||
""
)

+

" "

+

x.innerText;


x.style.display=

searchable
.toLowerCase()
.includes(val)

||

(
x.href.includes(
"tools.html"
)

&&

toolItems.includes(
val
)

)

?

"block"

:

"none";

}

);

}

const bg=
document.getElementById(
"bg-video"
);

function startVideo(){

if(!bg)return;

bg.muted=true;

bg.setAttribute(
"muted",
""
);

bg.setAttribute(
"playsinline",
""
);

bg.setAttribute(
"webkit-playsinline",
""
);

const play=
bg.play();

if(play!==undefined){

play.catch(()=>{

setTimeout(
()=>bg.play(),
500
);

});

}

}

window.addEventListener(
"load",
startVideo
);

document.addEventListener(
"visibilitychange",
()=>{

if(
!document.hidden
)

startVideo();

});

document.addEventListener(
"touchstart",
startVideo,
{
once:true
}
);

async function loadPagerDuty(){

try{

const TOKEN=
"u+mnguNsLNMzxz7KoUuA";

const res=
await fetch(

"https://api.pagerduty.com/incidents?team_ids[]=PK3J30X&statuses[]=triggered&statuses[]=acknowledged&limit=100",

{
headers:{
Authorization:
`Token token=${TOKEN}`,
Accept:
"application/vnd.pagerduty+json;version=2"
}
}

);

const data=
await res.json();

const c={

P1:{o:0,t:0,a:0},

P2:{o:0,t:0,a:0},

P3:{o:0,t:0,a:0}

};

(data.incidents||[]).forEach(i=>{

const p=
(
i.priority?.summary
||
i.priority?.name
||
"P3"
)

.match(/P[123]/)

?.[0];

if(!p)return;

c[p].o++;

if(i.status==="triggered")
c[p].t++;

if(i.status==="acknowledged")
c[p].a++;

});

["P1","P2","P3"]

.forEach(p=>{

document.getElementById(
p.toLowerCase()+"o"
).innerHTML=
c[p].o;

document.getElementById(
p.toLowerCase()+"t"
).innerHTML=
c[p].t;

document.getElementById(
p.toLowerCase()+"a"
).innerHTML=
c[p].a;

});

document
.querySelector(".p1")
.classList.toggle(
"alert",
c.P1.o>0
);

document
.querySelector(".p2")
.classList.toggle(
"alert",
c.P2.o>0
);

}

catch(e){

console.log(
"PD ERROR:",
e
);

}

}

loadPagerDuty();

setInterval(
loadPagerDuty,
60000
);

function logout(){

localStorage.removeItem(
"navexLogin"
);

location.reload();

}

</script>
