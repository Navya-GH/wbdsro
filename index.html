<!DOCTYPE html>
<html>

<head>

<title>SRO Dashboard</title>

<style>

*{box-sizing:border-box;}

body{

margin:0;

padding:30px;

font-family:Arial;

color:white;

min-height:100vh;

overflow-x:hidden;

position:relative;

background:#020617;

}

/* VIDEO BACKGROUND */

#bg-video{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

object-fit:cover;

z-index:-10;

filter:
brightness(.55);

}


/* OVERLAY */

body::after{

content:"";

position:fixed;

inset:0;

background:

linear-gradient(

180deg,

rgba(
2,
8,
23,
0.25
),

rgba(
2,
8,
23,
0.55
)

);

z-index:-5;

pointer-events:none;

}



.top{

display:flex;

justify-content:space-between;

align-items:flex-start;

margin-bottom:20px;

}

.timezones{

display:flex;

gap:10px;

flex-wrap:wrap;

}

.tz{

padding:10px 18px;

border-radius:14px;

background:

rgba(
255,
255,
255,
0.08
);

backdrop-filter:
blur(18px);

font-size:14px;

min-width:120px;

}

.clock{

text-align:right;

font-size:16px;

opacity:.9;

}

h1{

text-align:center;

font-size:72px;

margin:10px 0 35px;

}

.search{

width:min(
850px,
95%
);

display:block;

margin:auto;

padding:20px;

border:none;

border-radius:20px;

background:

rgba(
255,
255,
255,
0.08
);

backdrop-filter:
blur(25px);

color:white;

font-size:22px;

outline:none;

margin-bottom:30px;

}

.search::placeholder{

color:#bdbdbd;

}

.container{

display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(
230px,
1fr
)
);

gap:22px;

}

.main-btn{

width:100%;

height:120px;

border:none;

border-radius:24px;

cursor:pointer;

color:white;

font-size:28px;

background:

rgba(
255,
255,
255,
0.08
);

backdrop-filter:
blur(30px);

transition:.25s;

}

.main-btn:hover{

transform:
translateY(-6px);

background:

linear-gradient(
135deg,
#5b5cf6,
#8b5cf6
);

}

a{

text-decoration:none;

}

.footer{

position:fixed;

bottom:18px;

left:0;

width:100%;

text-align:center;

opacity:.55;

font-size:18px;

pointer-events:none;

}

@media(max-width:900px){

h1{

font-size:46px;

}

.timezones{

justify-content:center;

}

.footer{

font-size:14px;

bottom:12px;

}

}

</style>

</head>

<body>


<video
id="bg-video"
autoplay
muted
loop
playsinline>

<source
src="RG.mp4"
type="video/mp4">

</video>



<div class="top">

<div class="timezones">

<div class="tz">🇮🇳 IST<br><span id="ist"></span></div>

<div class="tz">🌍 UTC<br><span id="utc"></span></div>

<div class="tz">🇬🇧 BST<br><span id="bst"></span></div>

<div class="tz">🇺🇸 PST<br><span id="pst"></span></div>

</div>

<div class="clock">

<div id="greeting"></div>

</div>

</div>


<h1>
SRO Dashboard
</h1>


<input
class="search"
placeholder="Search Tools, Grafana, PagerDuty..."
onkeyup="filterButtons()"
id="search">



<div class="container">

<a data-search="tools grafana kibana mux tundra studio disco datadog foundry taiga" href="tools.html"><button class="main-btn">Tools</button></a>

<a data-search="pager duty incidents" href="https://discoveryinc.pagerduty.com/incidents" target="_blank"><button class="main-btn">PagerDuty</button></a>

<a data-search="mail outlook sro" href="https://outlook.cloud.microsoft/mail/sro.uk@wbd.com/" target="_blank"><button class="main-btn">SRO Mailbox</button></a>

<a data-search="hbo max" href="https://play.hbomax.com/" target="_blank"><button class="main-btn">HBO Max</button></a>

<a data-search="service now snow" href="https://wbd.service-now.com/" target="_blank"><button class="main-btn">Service Now</button></a>

<a data-search="sharepoint docs" href="https://warnermedia.sharepoint.com/" target="_blank"><button class="main-btn">SharePoint</button></a>

<a data-search="confluence wiki" href="https://wbdstreaming.atlassian.net/" target="_blank"><button class="main-btn">Confluence</button></a>

<a data-search="sling shifts" href="https://app.getsling.com/" target="_blank"><button class="main-btn">Sling</button></a>

<a data-search="events live checks" href="https://warnermedia.sharepoint.com/" target="_blank"><button class="main-btn">Live Event Checks</button></a>

</div>


<div class="footer">

SRO Dashboard • v1.0 • Built by Navya

</div>



<script>

function format(zone){

return new Date()

.toLocaleTimeString(
"en-GB",
{
hour12:false,
timeZone:zone
}

);

}


function clock(){

document.getElementById("ist").innerHTML=
format("Asia/Kolkata");

document.getElementById("utc").innerHTML=
format("UTC");

document.getElementById("bst").innerHTML=
format("Europe/London");

document.getElementById("pst").innerHTML=
format("America/Los_Angeles");

let hr=
new Date().getHours();

document.getElementById(
"greeting"
).innerHTML=

hr<12
?
"Good Morning"

:
hr<18
?
"Good Afternoon"

:
"Good Evening";

}

clock();

setInterval(
clock,
1000
);



function filterButtons(){

let val=

document
.getElementById(
"search"
)
.value
.trim()
.toLowerCase();


const toolItems=

`
tools
mux
mediamelon
inflow
ad-platform ui
tundra
sdp console
tempo
studio
dacc
grafana
foundry
taiga
chimera
kibana
disco
datadog
coui
`
.toLowerCase();


document
.querySelectorAll(
".container a"
)

.forEach(

x=>{

let searchable=

(
x.dataset.search
||
""
)

+

" "

+

x.innerText;


x.style.display=

searchable
.toLowerCase()
.includes(val)

||

(
x.href.includes(
"tools.html"
)

&&

toolItems.includes(
val
)

)

?

"block"

:

"none";

}

);

}

</script>

</body>

</html>
